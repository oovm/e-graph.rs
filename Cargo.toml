[workspace]
resolver = "2"
members = [
    "projects/compilers/dxo-core",
    "projects/compilers/dxo-napi",
    "projects/compilers/dxo-studio",
    "projects/compilers/dxo-studio-tauri",
    "projects/compilers/dxo-lite-wasm",
]
default-members = ["projects/compilers/dxo-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["DXO Contributors"]
repository = "https://github.com/ai4waifu/dxo-framework"
rust-version = "1.77"

[workspace.dependencies]
dxo-core = { path = "projects/compilers/dxo-core" }
dxo-studio = { path = "projects/compilers/dxo-studio" }
rand = "0.10.2"
napi = { version = "3.12.1", default-features = true, features = ["napi4"] }
napi-derive = "3.6.3"
titan-backend-cpu = { git = "https://github.com/ai4waifu/titan.rs.git", branch = "dev" }
titan-backend-cuda = { git = "https://github.com/ai4waifu/titan.rs.git", branch = "dev" }
titan-graph = { git = "https://github.com/ai4waifu/titan.rs.git", branch = "dev" }
titan-hal = { git = "https://github.com/ai4waifu/titan.rs.git", branch = "dev" }
titan-runtime = { git = "https://github.com/ai4waifu/titan.rs.git", branch = "dev" }
titan-tensor = { git = "https://github.com/ai4waifu/titan.rs.git", branch = "dev" }
titan-types = { git = "https://github.com/ai4waifu/titan.rs.git", branch = "dev" }
ucf = { git = "https://github.com/muse-gpt/ucf.rs.git", branch = "dev", default-features = false }
ucf-backend-cuda = { git = "https://github.com/muse-gpt/ucf.rs.git", branch = "dev" }
ucf-ir = { git = "https://github.com/muse-gpt/ucf.rs.git", branch = "dev" }
ucf-scheduler = { git = "https://github.com/muse-gpt/ucf.rs.git", branch = "dev" }
ucf-types = { git = "https://github.com/muse-gpt/ucf.rs.git", branch = "dev" }
ucf-runtime = { git = "https://github.com/muse-gpt/ucf.rs.git", branch = "dev" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "warn"
unsafe_code = "warn"

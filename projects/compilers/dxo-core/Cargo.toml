[package]
name = "dxo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "DXO deep learning core engine (tensor, autograd, backends)"
publish = false

[lints]
workspace = true

[dependencies]
rand = { workspace = true }
png = "0.17"
serde_json = "1"
titan-backend-cpu = { workspace = true }
# INTERIM: device session open only — remove when titan-runtime exposes open_cuda_primary().
titan-backend-cuda = { workspace = true }
titan-graph = { workspace = true }
titan-runtime = { workspace = true }
titan-tensor = { workspace = true }
titan-types = { workspace = true }
titan-hal = { workspace = true }
ucf = { workspace = true, optional = true }
ucf-backend-cuda = { workspace = true, optional = true }
ucf-ir = { workspace = true, optional = true }
ucf-scheduler = { workspace = true, optional = true }
ucf-types = { workspace = true, optional = true }
ucf-runtime = { workspace = true, optional = true }

[features]
default = []
ucf = [
    "dep:ucf",
    "dep:ucf-backend-cuda",
    "dep:ucf-ir",
    "dep:ucf-scheduler",
    "dep:ucf-types",
    "dep:ucf-runtime",
]